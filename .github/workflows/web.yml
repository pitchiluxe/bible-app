name: Deploy Bible web app
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to GitHub Pages (enable Pages with GitHub Actions first)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/renderer/**'
      - 'vite.web.config.ts'
      - 'package*.json'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'tests/web-platform.cjs'
      - 'tsconfig*.json'
      - '.github/workflows/web.yml'
permissions:
  contents: read
concurrency:
  group: bible-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run web:test
      - run: npm run web:check
      - run: npm run web:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
