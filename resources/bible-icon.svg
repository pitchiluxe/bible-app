<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4B3AE8"/>
      <stop offset="100%" stop-color="#1a1535"/>
    </radialGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f0e3"/>
      <stop offset="100%" stop-color="#e8d9c0"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="100%" stop-color="#C49A22"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="120" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Inner glow ring -->
  <circle cx="128" cy="128" r="110" fill="none" stroke="rgba(107,78,255,0.3)" stroke-width="1"/>

  <!-- Book (Bible) -->
  <g filter="url(#shadow)">
    <!-- Book spine -->
    <rect x="72" y="68" width="14" height="120" rx="3" fill="url(#spineGrad)"/>
    <!-- Book pages / cover -->
    <rect x="84" y="68" width="100" height="120" rx="4" fill="url(#bookGrad)"/>
    <!-- Page lines suggestion -->
    <rect x="94" y="90" width="80" height="2" rx="1" fill="rgba(0,0,0,0.12)"/>
    <rect x="94" y="100" width="72" height="2" rx="1" fill="rgba(0,0,0,0.10)"/>
    <rect x="94" y="110" width="76" height="2" rx="1" fill="rgba(0,0,0,0.10)"/>
    <rect x="94" y="120" width="68" height="2" rx="1" fill="rgba(0,0,0,0.08)"/>
    <rect x="94" y="148" width="80" height="2" rx="1" fill="rgba(0,0,0,0.08)"/>
    <rect x="94" y="158" width="64" height="2" rx="1" fill="rgba(0,0,0,0.07)"/>
    <rect x="94" y="168" width="74" height="2" rx="1" fill="rgba(0,0,0,0.07)"/>
    <!-- Spine highlight -->
    <rect x="73" y="68" width="3" height="120" rx="1.5" fill="rgba(255,255,255,0.4)"/>
  </g>

  <!-- Cross (overlaid center) -->
  <g filter="url(#glow)" transform="translate(128, 133)">
    <!-- Vertical bar -->
    <rect x="-7" y="-38" width="14" height="60" rx="3" fill="url(#crossGrad)"/>
    <!-- Horizontal bar -->
    <rect x="-26" y="-20" width="52" height="14" rx="3" fill="url(#crossGrad)"/>
    <!-- Center shine -->
    <rect x="-4" y="-16" width="5" height="8" rx="2" fill="rgba(255,255,255,0.5)"/>
  </g>

  <!-- Subtle star sparkles -->
  <g fill="rgba(255,255,255,0.6)">
    <circle cx="44" cy="52" r="2"/>
    <circle cx="210" cy="70" r="1.5"/>
    <circle cx="58" cy="200" r="1.5"/>
    <circle cx="218" cy="195" r="2"/>
    <circle cx="36" cy="140" r="1"/>
    <circle cx="225" cy="135" r="1"/>
  </g>
</svg>
